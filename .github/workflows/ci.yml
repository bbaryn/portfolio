name: CI

# Runs on every push to main (a merged PR is a push to main too) and on demand from the Actions tab.
# Checks the code, builds the static site and deploys it to GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read # required by deploy-pages
  pages: write # deploy to Pages
  id-token: write # verify the deployment comes from this repo

# One deployment at a time; a newer push waits instead of cancelling a running deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The <owner>.github.io repo is served from the domain root; any other repo from /<repo>, so asset paths need that prefix.
      # With a custom domain, use an empty base path.
      - name: Build
        run: |
          if [ "$REPO" = "$OWNER.github.io" ]; then base=""; else base="/$REPO"; fi
          PAGES_BASE_PATH="$base" NEXT_PUBLIC_SITE_URL="https://$OWNER.github.io$base" pnpm build
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
